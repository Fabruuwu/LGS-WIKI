<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipos · LGS Wiki</title>
<link rel="stylesheet" href="css/styles.css">
<style>
/* ── EQUIPOS WRAP ── */
.equipos-wrap{
  position:relative;z-index:1;
  max-width:1100px;margin:100px auto 60px;padding:0 20px;
}
.equipos-intro{
  position:relative;z-index:2;
  text-align:center;margin-bottom:40px;
}
.equipos-desc{
  color:rgba(255,255,255,.7);
  font-size:1rem;line-height:1.7;max-width:620px;margin:16px auto 24px;
}
.equipos-version{
  display:inline-block;
  background:linear-gradient(90deg,rgba(155,89,245,.2),rgba(0,229,255,.2));
  border:1px solid rgba(0,229,255,.35);border-radius:20px;padding:6px 22px;
  font-family:'Cinzel Decorative',cursive;font-size:.78rem;letter-spacing:2px;color:var(--cyan);
}

/* ── SELECTOR DE REGIÓN ── */
.selector-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  justify-content: center;
  margin-bottom: 40px;
}
.general-col {
  flex: 1;
  min-width: 250px;
  max-width: 400px;
  background: rgba(20,20,40,0.8);
  border: 1px solid rgba(155,89,245,0.25);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.general-title {
  font-family: 'Cinzel Decorative', cursive;
  font-size: 1.3rem;
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-align: center;
}
.region-btn {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 1px;
}
.region-btn:hover {
  background: rgba(155,89,245,0.2);
  border-color: var(--violet);
  color: #fff;
}

/* ── BARRA DE NAVEGACIÓN INTERNA ── */
.back-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.back-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(155,89,245,0.3);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--violet);
  cursor: pointer;
  transition: background 0.2s;
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 1px;
}
.back-btn:hover {
  background: rgba(155,89,245,0.2);
}
.active-selection {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
}

/* ── REGLAS (se muestra dinámicamente) ── */
.reglas-box {
  background: rgba(0,229,255,0.08);
  border: 1px solid rgba(0,229,255,0.25);
  border-radius: 14px;
  padding: 18px 22px;
  margin-bottom: 28px;
  color: rgba(255,255,255,0.8);
  font-size: 0.9rem;
  line-height: 1.7;
}
.reglas-box strong {
  color: var(--cyan);
}

/* ── LISTA DE EQUIPOS ── */
#equipos-list {
  display: none;
}
.equipo-card{
  background: rgba(10,10,20,0.85);
  border:1px solid rgba(155,89,245,0.35);
  border-radius:14px;
  padding:16px 20px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:20px;
  transition:border-color .3s,box-shadow .3s;
}
.equipo-card:hover{
  border-color:var(--violet);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.equipo-num{
  font-family:'Cinzel Decorative',cursive;
  font-size:.75rem;color:rgba(255,255,255,.25);
  width:24px;flex-shrink:0;text-align:center;
}
.equipo-chars{display:flex;gap:10px;flex-shrink:0;}

/* NUEVA BARRA DE DAÑO */
.equipo-dmg-bar{
  width:200px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.dmg-top-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  width: 100%;
}
.dmg-percent{
  font-size:1.3rem;font-weight:900;color:var(--gold);
}
.dmg-number{
  font-size:1.4rem;font-weight:900;color:#fff;
  line-height:1;
}
.dmg-number small {
  font-size:0.7rem;
  font-weight:600;
  color:rgba(255,255,255,0.5);
  margin-left:4px;
}
.bar-bg{width:100%;height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:4px;}

/* Tarjetas de personajes */
.eq-card{
  width:105px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0;
}
.eq-card-art{width:100%;height:80px;position:relative;overflow:hidden;}
.eq-card-art img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
.eq-card-art-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:rgba(255,255,255,.15);}
.eq-card-elem{position:absolute;top:5px;left:5px;width:9px;height:9px;
  border-radius:50%;border:1px solid rgba(255,255,255,.3);z-index:2;}
.eq-card-body{padding:5px 6px;background:rgba(10,10,26,.85);
  border-top:1px solid rgba(255,255,255,.06);text-align:center;}
.eq-card-name{font-family:'Cinzel Decorative',cursive;font-size:.58rem;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.eq-card-elname{font-size:.5rem;color:rgba(255,255,255,.35);letter-spacing:1px;margin-top:1px;}

/* Responsive */
@media(max-width:700px){
  .selector-grid {
    flex-direction: column;
    align-items: center;
  }
  .general-col {
    width: 100%;
    max-width: 400px;
  }
  .equipo-card{flex-wrap:wrap;}
  .equipo-dmg-bar{
    width:100%;
    flex-direction:row;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .dmg-top-row {
    flex-direction: row;
    justify-content: flex-start;
    gap: 10px;
    width: auto;
  }
  .bar-bg{flex:1;margin:0 8px;}
  .eq-card{width:84px;}
  .eq-card-art{height:66px;}
}
</style>
</head>
<body data-page="equipos">
<div class="bg-layer"></div>
<script src="js/nav.js"></script>

<div class="equipos-wrap">
  <div class="equipos-intro">
    <div class="section-badge">✦ Estrategia ✦</div>
    <h1 class="section-title">Equipos</h1>
    <p class="equipos-desc">Descubrí los equipos más poderosos del universo LGS. Combinaciones optimizadas para arrasar en el campo de batalla.</p>
  </div>

  <!-- PANEL DE SELECCIÓN -->
  <div id="selector-panel">
    <div class="selector-grid">
      <div class="general-col">
        <div class="general-title">General</div>
        <button class="region-btn" data-region="1.0">Región 0 (1.0)</button>
        <button class="region-btn" data-region="1.1">Región 1 (1.1)</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE RETORNO + INFO DE SELECCIÓN -->
  <div id="nav-bar" style="display: none;">
    <div class="back-bar">
      <button class="back-btn" id="back-btn">← Volver a selección</button>
      <span class="active-selection" id="active-selection-text"></span>
    </div>
    <div id="reglas-container"></div>
  </div>

  <!-- LISTA DE EQUIPOS (se llena dinámicamente) -->
  <div id="equipos-list"></div>
</div>

<script src="data/personajes-data.js" defer></script>
<script src="data/equipos-data.js" defer></script>
<script src="js/scripts.js" defer></script>
<div id="global-tooltip"></div>

<script defer>
let currentSelection = null;

// ════════════════════════════════════════
// FUNCIONES DE RENDER DE EQUIPOS
// ════════════════════════════════════════
function renderEquipos(equipos) {
  const container = document.getElementById('equipos-list');
  if (!container) return;

  if (!equipos || equipos.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.4);">No hay equipos disponibles para esta selección.</p>';
    container.style.display = 'block';
    return;
  }

  const DAMAGE_BASE = equipos.length >= 5 ? equipos[4].dmg : equipos[0].dmg;

  container.innerHTML = equipos.map((equipo, idx) => {
    const porcentaje = Math.round((equipo.dmg / DAMAGE_BASE) * 100);
    const relativo   = porcentaje - 100;
    const signo      = relativo >= 0 ? '+' : '';
    const barWidth   = Math.min(100, Math.max(0, porcentaje));

    const charsHTML = equipo.chars.map(id => {
      const c = CHARS.find(x => x.id === id);
      if (!c) {
        return `<div class="eq-card">
          <div class="eq-card-art">
            <div class="eq-card-art-bg">?</div>
          </div>
        </div>`;
      }
      const el = EC[c.element];
      const imgSrc = CARTA_IMG[id] || c.art;
      const artHtml = imgSrc
        ? `<img src="${imgSrc}" alt="${c.name}">`
        : `<div class="eq-card-art-bg" style="background:${GRAD[c.element]};"></div>`;
      return `
        <div class="eq-card">
          <div class="eq-card-art">
            ${artHtml}
            <div class="eq-card-elem" style="background:${el.color};box-shadow:0 0 5px ${el.color};"></div>
          </div>
          <div class="eq-card-body">
            <div class="eq-card-name">${c.name}</div>
            <div class="eq-card-elname">${el.label}</div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="equipo-card">
        <div class="equipo-num">#${idx + 1}</div>
        <div class="equipo-chars">${charsHTML}</div>
        <div class="equipo-dmg-bar">
          <div class="dmg-top-row">
            <span class="dmg-percent" style="color:${relativo > 0 ? '#69f0ae' : (relativo < 0 ? '#ff5252' : 'var(--gold)')}">${signo}${relativo}%</span>
            <span class="dmg-number">${equipo.dmg.toLocaleString()}<small>DMG</small></span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barWidth}%"></div></div>
        </div>
      </div>`;
  }).join('');

  container.style.display = 'block';
}

// ════════════════════════════════════════
// MANEJO DE LA INTERFAZ
// ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const selectorPanel = document.getElementById('selector-panel');
  const navBar = document.getElementById('nav-bar');
  const equiposList = document.getElementById('equipos-list');
  const reglasContainer = document.getElementById('reglas-container');
  const backBtn = document.getElementById('back-btn');
  const activeText = document.getElementById('active-selection-text');

  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const region = btn.dataset.region;
      const equipos = DATA_EQUIPOS[region] || [];

      currentSelection = { region };
      activeText.textContent = `General · Región ${region}`;

      // Mostrar reglas para ambas regiones
      reglasContainer.innerHTML = REGLAS_GENERAL;

      selectorPanel.style.display = 'none';
      navBar.style.display = 'block';
      equiposList.style.display = 'block';

      renderEquipos(equipos);
    });
  });

  backBtn.addEventListener('click', () => {
    selectorPanel.style.display = 'block';
    navBar.style.display = 'none';
    equiposList.style.display = 'none';
    equiposList.innerHTML = '';
    reglasContainer.innerHTML = '';
    currentSelection = null;
  });
});
</script>
</body>
</html>
