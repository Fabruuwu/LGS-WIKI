<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personajes · LGS Wiki</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="personajes">
<div class="bg-layer"></div>
<script src="js/nav.js"></script>

<div class="chars-wrap">
  <div class="section-header">
    <div class="section-badge">✦ Enciclopedia de Héroes ✦</div>
    <h2 class="section-title">Personajes</h2>
    <p class="section-sub">Explorá a los guerreros de la LGS, conocé sus habilidades únicas y dominá el campo de batalla.</p>
    <div class="hero-divider" style="margin: 20px auto;"></div>
  </div>

<div class="filters">
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Buscar por nombre...">
  </div>
  <div class="fg">
    <span class="fl">Elemento</span>
    <div class="fp" id="filter-elements"></div>
  </div>
  <div class="fg">
    <span class="fl">Rol</span>
    <div class="fp" id="filter-roles">
      <button class="pill active" data-role="all">Todos</button>
      <button class="pill" data-role="dps">DPS</button>
      <button class="pill" data-role="subdps">SubDPS</button>
      <button class="pill" data-role="soporte">Soporte</button>
      <button class="pill" data-role="sustain">Sustain</button>
    </div>
  </div>
  <div class="count-lbl"><span id="char-count">0</span> personajes</div>
</div>

  <div class="chars-grid" id="chars-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>
<script src="data/personajes-data.js" defer></script>
<script src="js/scripts.js" defer></script>
<div id="global-tooltip"></div>
</body>
</html>
